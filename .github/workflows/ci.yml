name: PathForAll validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: install
        run: npm ci
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run syntax
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run package
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: browser-diagnostics
          path: test-results/
  release-gate:
    runs-on: ubuntu-latest
    needs: [quality, browser]
    if: ${{ always() }}
    steps:
      - env:
          QUALITY: ${{ needs.quality.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$QUALITY" = success && test "$BROWSER" = success
